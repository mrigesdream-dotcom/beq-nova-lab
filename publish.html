<!DOCTYPE html>
<!--
  北桥创新实验室 - 永久发布页 (publish.html)
  职责：作为实验室的永久发布入口，把访问者均衡负载地转发到多个镜像/部署地址。
  · 与站内其他页面不互相链接（独立落地页）
  · 样式、主题变量、科技背景、转发逻辑已全部内联到本文件，复制即可部署
  · 转发地址在下方 <script> 的 TARGETS 数组里配置，增删改即刻生效
-->
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>永久发布入口 | 北桥创新实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>(function(){try{var t=localStorage.getItem("beq-theme");if(t)document.documentElement.setAttribute("data-theme",t);var c=JSON.parse(localStorage.getItem("beq-colors")||"{}");for(var k in c)document.documentElement.style.setProperty(k,c[k]);var n=localStorage.getItem("beq-neon");if(n)document.documentElement.style.setProperty("--neon-strength",n);}catch(e){}})();</script>

  <style>
  /* 作者：北桥实验室 姚自有 */
  /* ============================================================
     内联样式：主题变量 + 科技背景层 + 发布页样式
     ------------------------------------------------------------
     主题变量（原 theme.css）：浅色高级科技感默认，可切 dark/pinkgold
     科技背景（原 theme.css）：.tech-bg 蜂窝网格 + 光斑 + 雷达 + 扫描
     发布页样式（原 publish.css）：品牌标识 / hero / 转发卡 / 镜像卡 / 页脚
     ============================================================ */

  /* ============ 默认主题：浅色高级科技感 ============ */
  :root {
    /* —— 基础色 —— */
    --color-bg:        #eef2f9;      /* 页面背景 */
    --color-bg-rgb:    238, 242, 249;
    --color-card:      #ffffff;      /* 卡片背景 */
    --color-card-rgb:  255, 255, 255;
    --color-card2:     #f3f6fc;      /* 次级卡片 / 浅色块 */
    --color-card2-rgb: 243, 246, 252;
    --color-trace:     #dbe3f1;      /* 边框 / 分割线 */
    --color-trace-rgb: 219, 227, 241;
    --glass-rgb:       255, 255, 255;  /* 玻璃拟态底色 */
    --overlay-rgb:     17, 24, 42;     /* 深色遮罩（始终深色） */

    /* —— 文字色 —— */
    --color-white:     #0e1b33;      /* 主文字 */
    --color-white-rgb: 14, 27, 51;
    --color-silver:    #53627e;      /* 次要文字 */
    --color-silver-rgb:84, 99, 126;
    --color-muted:     #8494ad;      /* 弱化文字 */
    --color-muted-rgb: 132, 148, 173;

    /* —— 强调色（主题色）—— */
    --color-gold:      #0891b2;      /* 主色 · 电光青 */
    --color-gold-rgb:  8, 145, 178;
    --color-blue:      #4f46e5;      /* 副色 · 靛蓝 */
    --color-blue-rgb:  79, 70, 229;
    --color-purple:    #7c3aed;      /* 第三色 · 紫 */
    --color-purple-rgb:124, 58, 237;
    --color-copper:    #d97706;      /* 暖金点缀 */
    --color-copper-rgb:217, 119, 6;

    /* —— 霓虹辉光（始终高亮，用于扫描线 / 辉光）—— */
    --neon-rgb:        34, 211, 238;
    --neon2-rgb:       129, 140, 248;

    /* —— 可调参数 —— */
    --neon-strength:   1;            /* 霓虹强度 0 ~ 1 */
    --bg-grid-opacity: 0.5;          /* 背景网格浓度 */
    --bg-orb-opacity:  0.7;          /* 背景光斑浓度 */

    /* —— 字体 —— */
    --font-space: 'Space Grotesk', sans-serif;
    --font-inter: 'Inter', sans-serif;
    --font-mono:  'JetBrains Mono', monospace;
    --font-cn:    'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  /* ============ 深色主题：深空青蓝 ============ */
  [data-theme="dark"] {
    --color-bg:        #0b1221;
    --color-bg-rgb:    11, 18, 33;
    --color-card:      #111a2e;
    --color-card-rgb:  17, 26, 46;
    --color-card2:     #141f36;
    --color-card2-rgb: 20, 31, 54;
    --color-trace:     #22304a;
    --color-trace-rgb: 34, 48, 74;
    --glass-rgb:       17, 26, 46;
    --overlay-rgb:     13, 21, 38;
    --color-white:     #e6edf7;
    --color-white-rgb: 230, 237, 247;
    --color-silver:    #8b9ac0;
    --color-silver-rgb:139, 154, 192;
    --color-muted:     #7d8bb0;
    --color-muted-rgb: 125, 139, 176;
    --color-gold:      #22d3ee;
    --color-gold-rgb:  34, 211, 238;
    --color-blue:      #818cf8;
    --color-blue-rgb:  129, 140, 248;
    --color-purple:    #a855f7;
    --color-purple-rgb:168, 85, 247;
    --color-copper:    #f0a050;
    --color-copper-rgb:240, 160, 80;
    --neon-rgb:        34, 211, 238;
    --neon2-rgb:       129, 140, 248;
  }

  /* ============ 粉金主题：高级粉金 ============ */
  [data-theme="pinkgold"] {
    --color-bg:        #fdf6f4;
    --color-bg-rgb:    253, 246, 244;
    --color-card:      #ffffff;
    --color-card-rgb:  255, 255, 255;
    --color-card2:     #fbeeea;
    --color-card2-rgb: 251, 238, 234;
    --color-trace:     #eed8d5;
    --color-trace-rgb: 238, 216, 213;
    --glass-rgb:       255, 255, 255;
    --overlay-rgb:     43, 24, 34;
    --color-white:     #3a2230;
    --color-white-rgb: 58, 34, 48;
    --color-silver:    #8a6b78;
    --color-silver-rgb:138, 107, 120;
    --color-muted:     #a68a96;
    --color-muted-rgb: 166, 138, 150;
    --color-gold:      #e8738a;
    --color-gold-rgb:  232, 115, 138;
    --color-blue:      #b080c9;
    --color-blue-rgb:  176, 128, 201;
    --color-purple:    #a86bae;
    --color-purple-rgb:168, 107, 174;
    --color-copper:    #d4956b;
    --color-copper-rgb:212, 149, 107;
    --neon-rgb:        232, 115, 138;
    --neon2-rgb:       176, 128, 201;
  }

  /* ============================================================
     科技背景层（.tech-bg，原 theme.css）
     ============================================================ */
  .tech-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
  }
  /* 网格 */
  .tech-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(var(--color-gold-rgb), calc(0.10 * var(--bg-grid-opacity))) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--color-gold-rgb), calc(0.10 * var(--bg-grid-opacity))) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: var(--bg-grid-opacity);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 30%, transparent 100%);
    mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 30%, transparent 100%);
  }
  /* 点阵 */
  .tech-bg .bg-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(var(--color-blue-rgb), 0.16) 1px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: calc(0.6 * var(--bg-grid-opacity));
  }
  /* 光斑 */
  .tech-bg .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: var(--bg-orb-opacity);
  }
  .tech-bg .bg-orb.o1 { width: 480px; height: 480px; top: -120px; right: -80px;  background: rgba(var(--neon-rgb), 0.20); animation: orb-float 16s ease-in-out infinite; }
  .tech-bg .bg-orb.o2 { width: 380px; height: 380px; top: 30%; left: -120px;   background: rgba(var(--color-blue-rgb), 0.18); animation: orb-float 20s ease-in-out infinite reverse; }
  .tech-bg .bg-orb.o3 { width: 420px; height: 420px; bottom: -140px; right: 20%; background: rgba(var(--color-purple-rgb), 0.16); animation: orb-float 24s ease-in-out infinite; }
  @keyframes orb-float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-30px, 24px) scale(1.06); }
    66%      { transform: translate(24px, -18px) scale(0.96); }
  }
  /* 顶部扫描线 */
  .tech-bg .bg-scan {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--neon-rgb), 0.7), rgba(var(--neon2-rgb), 0.7), transparent);
    animation: bg-scan-move 9s linear infinite;
    opacity: calc(0.9 * var(--neon-strength));
  }
  @keyframes bg-scan-move {
    0%   { transform: translateY(0); }
    100% { transform: translateY(100vh); }
  }
  /* HUD 四角括号 */
  .tech-bg .bg-corner {
    position: absolute;
    width: 34px; height: 34px;
    border: 1px solid rgba(var(--color-gold-rgb), 0.35);
  }
  .tech-bg .bg-corner.c1 { top: 18px; left: 18px; border-width: 1px 0 0 1px; }
  .tech-bg .bg-corner.c2 { top: 18px; right: 18px; border-width: 1px 1px 0 0; }
  .tech-bg .bg-corner.c3 { bottom: 18px; left: 18px; border-width: 0 0 1px 1px; }
  .tech-bg .bg-corner.c4 { bottom: 18px; right: 18px; border-width: 0 1px 1px 0; }
  /* 所有背景层子元素不拦截鼠标 */
  .tech-bg > * { pointer-events: none; }
  /* 六边形蜂窝纹理 */
  .tech-bg .bg-hex {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: calc(0.5 * var(--bg-grid-opacity));
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 40%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 40%, transparent 100%);
  }
  .tech-bg .bg-hex path { stroke: rgba(var(--color-gold-rgb), 0.30); }
  /* 雷达扫描（右下角） */
  .tech-bg .bg-radar {
    position: absolute;
    right: 5%;
    bottom: 6%;
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 1px solid rgba(var(--color-gold-rgb), 0.18);
    background: repeating-radial-gradient(circle, transparent 0 43px, rgba(var(--color-gold-rgb), 0.14) 43px 44px);
    opacity: calc(0.8 * var(--bg-orb-opacity));
  }
  .tech-bg .bg-radar::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(var(--neon-rgb), 0.35), transparent 70deg, transparent 360deg);
    animation: radar-spin 7s linear infinite;
  }
  .tech-bg .bg-radar::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(var(--neon-rgb), 0.85);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 14px rgba(var(--neon-rgb), 0.9);
  }
  @keyframes radar-spin { to { transform: rotate(360deg); } }
  /* 同心圆环（左下角） */
  .tech-bg .bg-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(var(--color-blue-rgb), 0.18);
  }
  .tech-bg .bg-ring.r1 { width: 360px; height: 360px; left: -130px; top: 56%; }
  .tech-bg .bg-ring.r2 { width: 540px; height: 540px; left: -50px; top: 44%; border-color: rgba(var(--color-purple-rgb), 0.13); }
  /* 漂浮二进制数据 */
  .tech-bg .bg-data {
    position: absolute;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    -webkit-writing-mode: vertical-rl;
    writing-mode: vertical-rl;
    color: rgba(var(--color-gold-rgb), 0.22);
    user-select: none;
    animation: data-blink 5s ease-in-out infinite;
  }
  .tech-bg .bg-data.d1 { right: 13%; top: 22%; }
  .tech-bg .bg-data.d2 { left: 7%; bottom: 20%; font-size: 11px; color: rgba(var(--color-purple-rgb), 0.22); animation-delay: 1.4s; }
  .tech-bg .bg-data.d3 { right: 27%; top: 63%; font-size: 10px; color: rgba(var(--color-blue-rgb), 0.24); animation-delay: 2.6s; }
  @keyframes data-blink {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.9; }
  }

  /* ============================================================
     发布页样式（原 publish.css）
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body { overflow-x: hidden; }
  body {
    background-color: var(--color-bg);
    color: var(--color-white);
    font-family: var(--font-inter);
    overflow-x: hidden;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--color-card); }
  ::-webkit-scrollbar-thumb { background: var(--color-gold); border-radius: 4px; }

  /* ---------- 顶部品牌标识 ---------- */
  .pub-header {
    display: flex;
    justify-content: center;
    padding: 28px 20px 8px;
    position: relative;
    z-index: 1;
  }
  .logo-chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px 6px 8px;
    border: 1px solid rgba(var(--color-gold-rgb), 0.32);
    border-radius: 8px;
    background: rgba(var(--color-gold-rgb), 0.07);
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  .logo-chip:hover {
    border-color: rgba(var(--color-gold-rgb), 0.7);
    background: rgba(var(--color-gold-rgb), 0.14);
    box-shadow: 0 0 22px rgba(var(--color-gold-rgb), 0.3);
  }
  .logo-chip::before,
  .logo-chip::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--color-gold);
    border-style: solid;
    opacity: 0.9;
    pointer-events: none;
  }
  .logo-chip::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 6px 0 0 0; }
  .logo-chip::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 6px 0; }
  .logo-chip svg {
    filter: drop-shadow(0 0 5px rgba(var(--color-gold-rgb), 0.5));
    animation: logo-breathe 3s ease-in-out infinite;
  }
  @keyframes logo-breathe {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(var(--color-gold-rgb), 0.45)); }
    50%      { filter: drop-shadow(0 0 13px rgba(var(--neon-rgb), 0.85)); }
  }
  .logo-chip svg rect[fill="#FFFFFF"] { fill: rgba(var(--color-gold-rgb), 0.08); stroke: var(--color-gold); }
  .logo-chip svg rect[fill="#22d3ee"],
  .logo-chip svg rect[fill="#0891b2"] { fill: var(--color-gold); }
  .logo-chip svg circle[fill="#22d3ee"],
  .logo-chip svg circle[fill="#0891b2"] { fill: var(--color-gold); }
  .logo-text {
    font-family: var(--font-space);
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }
  .logo-cn {
    font-family: var(--font-cn);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--color-silver);
    display: block;
    line-height: 1;
    margin-top: 2px;
  }

  /* ---------- 主内容容器 ---------- */
  .pub-main {
    flex: 1 0 auto;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 24px 48px;
    position: relative;
    z-index: 1;
  }

  /* ---------- hero ---------- */
  .pub-hero { text-align: center; padding: 40px 0 8px; }
  .pub-kicker {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--color-blue);
    letter-spacing: 0.22em;
    margin-bottom: 14px;
  }
  .pub-title {
    font-family: var(--font-space);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.2rem);
    background: linear-gradient(135deg, var(--color-gold), var(--color-silver));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .pub-divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, var(--color-gold), var(--color-blue));
    margin: 16px auto 18px;
    border-radius: 2px;
  }
  .pub-sub {
    font-family: var(--font-cn);
    font-size: 1rem;
    color: var(--color-silver);
    opacity: 0.85;
  }

  /* ---------- 主转发卡 ---------- */
  .pub-enter { padding: 36px 0 20px; }
  .pub-enter-card {
    max-width: 560px;
    margin: 0 auto;
    padding: 36px 32px;
    background: var(--color-card);
    border: 1px solid var(--color-trace);
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(var(--color-gold-rgb), 0.06);
    position: relative;
    overflow: hidden;
  }
  .pub-enter-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 80% at 50% 0%, rgba(var(--color-gold-rgb), 0.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .pub-enter-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 40px;
    font-family: var(--font-space);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    color: #ffffff;
    border: none;
    border-radius: 0;
    cursor: pointer;
    background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-blue) 100%);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    transition: box-shadow 0.3s, filter 0.3s, transform 0.2s;
  }
  .pub-enter-btn:hover {
    filter: brightness(1.1);
    box-shadow: 0 0 30px rgba(var(--neon-rgb), 0.55);
    transform: translateY(-1px);
  }
  .pub-enter-btn:active { transform: translateY(0); }
  .pub-enter-note {
    position: relative;
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-silver);
    letter-spacing: 0.02em;
  }
  .pub-enter-note i { color: var(--color-gold); margin-right: 4px; }
  .pub-enter-note span { color: var(--color-gold); font-weight: 500; }

  /* ---------- 镜像地址列表 ---------- */
  .pub-targets { padding-top: 20px; }
  .pub-targets-head { text-align: center; margin-bottom: 24px; }
  .pub-targets-title {
    font-family: var(--font-space);
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--color-white);
    margin-bottom: 6px;
  }
  .pub-targets-sub {
    font-family: var(--font-cn);
    font-size: 0.86rem;
    color: var(--color-muted);
  }

  /* 地址卡片网格：桌面 3 列，后续增地址自动换行 */
  .target-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .target-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 18px;
    background: var(--color-card);
    border: 1px solid var(--color-trace);
    border-radius: 12px;
    text-decoration: none;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    overflow: hidden;
  }
  .target-card:hover {
    transform: translateY(-4px);
    border-color: rgba(var(--color-gold-rgb), 0.45);
    box-shadow: 0 10px 30px rgba(var(--color-gold-rgb), 0.12);
  }
  .target-tag {
    flex-shrink: 0;
    min-width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--color-gold);
    background: rgba(var(--color-gold-rgb), 0.1);
    border: 1px solid rgba(var(--color-gold-rgb), 0.3);
    border-radius: 8px;
  }
  .target-info { min-width: 0; flex: 1; }
  .target-name {
    font-family: var(--font-cn);
    font-weight: 700;
    font-size: 1rem;
    color: var(--color-white);
    margin-bottom: 3px;
  }
  .target-desc {
    font-size: 0.82rem;
    color: var(--color-silver);
    margin-bottom: 8px;
  }
  .target-url {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--color-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .target-arrow {
    flex-shrink: 0;
    margin-top: 10px;
    color: var(--color-muted);
    transition: color 0.25s, transform 0.25s;
  }
  .target-card:hover .target-arrow { color: var(--color-gold); transform: translate(2px, -2px); }

  /* ---------- 页脚 ---------- */
  .pub-footer {
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    padding: 40px 24px 28px;
    background: var(--color-card);
    border-top: 1px solid var(--color-trace);
  }
  #footer-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(var(--color-gold-rgb), 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--color-gold-rgb), 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .pub-footer-inner { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; text-align: center; }
  .pub-footer-line {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--color-muted);
    margin-bottom: 6px;
  }
  .pub-footer-mono span { color: var(--color-gold); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1024px) {
    .target-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 767px) {
    .pub-header { padding: 20px 16px 4px; }
    .pub-main { padding: 12px 14px 40px; }
    .pub-hero { padding: 28px 0 4px; }
    .pub-kicker { font-size: 0.7rem; letter-spacing: 0.16em; }
    .pub-enter { padding: 24px 0 12px; }
    .pub-enter-card { padding: 28px 18px; }
    .pub-enter-btn { width: 100%; justify-content: center; padding: 16px 24px; font-size: 1rem; }
    .target-grid { grid-template-columns: 1fr; gap: 12px; }
    .pub-targets-head { margin-bottom: 18px; }
    a, button { -webkit-tap-highlight-color: rgba(34, 211, 238, 0.12); touch-action: manipulation; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-chip svg { animation: none; }
    .tech-bg .bg-orb, .tech-bg .bg-scan, .tech-bg .bg-radar::before, .tech-bg .bg-data { animation: none; }
  }
  </style>
</head>

<script>
/* 作者：北桥实验室 姚自有 */
/* ============================================================
   内联功能（原 publish.js）— 永久发布页 · 均衡负载转发
   ------------------------------------------------------------
   ★ 转发地址在这里配置：在下方 TARGETS 数组里增、删、改即可，
     页面会自动渲染对应卡片，并参与负载均衡轮询。
     字段说明：
       tag  序号标签（显示在卡片左上角，如 01 / 02 / A / B）
       name 名称（如「主站」「镜像一」）
       url  目标地址（完整 URL，含 https://）
       desc 简短描述（如「主部署」「备用部署」）
   ============================================================ */
(function () {
  'use strict';

  /* ================= 配置区：转发地址 ================= */
  var TARGETS = [
    { tag: '01', name: '发布地址 ①', url: 'https://www.axxiu.cn/project/0g9HBvKv/join.html', desc: '部署节点 ①' },
    { tag: '02', name: '发布地址 ②', url: 'https://www.axxiu.cn/project/2ufbdYAF/', desc: '部署节点 ②' },
    { tag: '03', name: '发布地址 ③', url: 'https://www.axxiu.cn/project/ReO6taC5/', desc: '部署节点 ③' },
    { tag: '04', name: '发布地址 ④', url: 'https://www.axxiu.cn/project/6K5HySUk/', desc: '部署节点 ④' },
    { tag: '05', name: '发布地址 ⑤', url: 'https://www.axxiu.cn/project/P7oocHm8/', desc: '部署节点 ⑤' }
  ];

  /* 均衡游标存储键（localStorage 持久化，保证每次访问轮换到下一地址） */
  var LS_CURSOR = 'beq-lb-cursor';

  /* ---------- HTML 转义 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ---------- 轮询均衡：每次取下一个地址 ---------- */
  function pickRoundRobin() {
    var i = parseInt(localStorage.getItem(LS_CURSOR) || '0', 10);
    if (isNaN(i)) i = 0;
    var idx = ((i % TARGETS.length) + TARGETS.length) % TARGETS.length;
    try { localStorage.setItem(LS_CURSOR, String(i + 1)); } catch (e) {}
    return TARGETS[idx];
  }

  /* ---------- 渲染地址卡片 ---------- */
  function renderTargets() {
    var grid = document.getElementById('target-grid');
    if (!grid) return;

    var html = '';
    TARGETS.forEach(function (t) {
      html +=
        '<a class="target-card" href="' + esc(t.url) + '">' +
          '<span class="target-tag">' + esc(t.tag) + '</span>' +
          '<span class="target-info">' +
            '<span class="target-name">' + esc(t.name) + '</span>' +
            '<span class="target-desc">' + esc(t.desc) + '</span>' +
            '<span class="target-url">' + esc(t.url) + '</span>' +
          '</span>' +
          '<i class="fas fa-arrow-right target-arrow"></i>' +
        '</a>';
    });
    grid.innerHTML = html;

    var count = document.getElementById('lb-count');
    if (count) count.textContent = String(TARGETS.length);
  }

  /* ---------- 主按钮：均衡转发跳转 ---------- */
  function bindEnter() {
    var btn = document.getElementById('lb-enter');
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (!TARGETS.length) return;
      var t = pickRoundRobin();
      window.location.href = t.url;
    });
  }

  /* ---------- 启动 ---------- */
  function init() {
    renderTargets();
    bindEnter();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
